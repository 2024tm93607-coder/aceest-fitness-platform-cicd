apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    #Remove the 'version' tag here so the service can hit 
    # both Main and Canary pods simultaneously during testing.
  ports:
    - protocol: TCP
      port: 80         # Port you visit in the browser
      targetPort: 5000 # Internal Flask port
      nodePort: 30005  # Permanent port for Minikube access